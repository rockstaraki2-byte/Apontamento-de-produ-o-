name: One-off Imperio item integrity audit

on:
  push:
    paths:
      - ".github/workflows/oneoff-imperio-item-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Audit Imperio item references
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { initializeApp } from "firebase/app";
          import {
            initializeFirestore,
            collection,
            doc,
            getDoc,
            getDocs,
            query,
            where,
          } from "firebase/firestore";

          const config = JSON.parse(fs.readFileSync("firebase-applet-config.json", "utf8"));
          const app = initializeApp({
            apiKey: config.apiKey,
            authDomain: config.authDomain,
            projectId: config.projectId,
            storageBucket: config.storageBucket,
            messagingSenderId: config.messagingSenderId,
            appId: config.appId,
          });

          const db = initializeFirestore(
            app,
            { experimentalForceLongPolling: true },
            config.firestoreDatabaseId,
          );

          const TENANT = "imperio";
          const referenced = new Map();

          function addRef(itemId, source, extra = {}) {
            const id = Number(itemId);
            if (!Number.isFinite(id) || id <= 0) return;
            const current = referenced.get(id) || { itemId: id, sources: [], examples: [] };
            if (!current.sources.includes(source)) current.sources.push(source);
            if (current.examples.length < 5 && Object.keys(extra).length) current.examples.push({ source, ...extra });
            referenced.set(id, current);
          }

          async function scoped(name) {
            return getDocs(query(collection(db, name), where("tenantId", "==", TENANT)));
          }

          const [
            ordersSnap,
            logsSnap,
            stocksSnap,
            movementsSnap,
            flowsSnap,
            pricesSnap,
            epiSnap,
            coilSnap,
            visibleItemsSnap,
          ] = await Promise.all([
            scoped("orders"),
            scoped("logs"),
            scoped("stocks"),
            scoped("stock_movements"),
            scoped("productFlows"),
            scoped("priceHistories"),
            scoped("epiDistributions"),
            scoped("coilCuttingPlans"),
            scoped("items"),
          ]);

          ordersSnap.forEach((d) => {
            const x = d.data();
            addRef(x.itemId, "orders", {
              orderId: d.id,
              orderCode: x.orderCode || "",
              customProductName: x.customProductName || "",
              color: x.color || "",
              size: x.size || "",
              variation: x.variation || "",
            });
          });

          logsSnap.forEach((d) => {
            const x = d.data();
            addRef(x.itemId, "logs", {
              logId: d.id,
              customProductName: x.customProductName || "",
              nestedPartName: x.nestedPartName || "",
              processName: x.processName || "",
            });
            addRef(x.parentItemId, "logs.parentItemId", { logId: d.id });
          });

          stocksSnap.forEach((d) => {
            const x = d.data();
            addRef(x.itemId, "stocks", {
              stockId: d.id,
              color: x.color || "",
              size: x.size || "",
              variation: x.variation || "",
            });
          });

          movementsSnap.forEach((d) => {
            const x = d.data();
            addRef(x.itemId, "stock_movements", {
              movementId: d.id,
              description: x.description || "",
            });
          });

          flowsSnap.forEach((d) => {
            const x = d.data();
            addRef(x.itemId, "productFlows", { flowId: d.id });
          });

          pricesSnap.forEach((d) => {
            const x = d.data();
            addRef(x.itemId, "priceHistories", { priceId: d.id });
          });

          epiSnap.forEach((d) => {
            const x = d.data();
            addRef(x.itemId, "epiDistributions", { distributionId: d.id });
          });

          coilSnap.forEach((d) => {
            const x = d.data();
            addRef(x.coilItemId, "coilCuttingPlans.coilItemId", { planId: d.id });
            for (const targetId of x.targetItemIds || []) {
              addRef(targetId, "coilCuttingPlans.targetItemIds", { planId: d.id });
            }
          });

          const visibleItemIds = new Set();
          visibleItemsSnap.forEach((d) => {
            const x = d.data();
            const id = Number(x.id ?? d.id);
            if (Number.isFinite(id)) visibleItemIds.add(id);
          });

          const legacyUnscoped = [];
          const missingDocuments = [];
          const imperioDocuments = [];
          const protectedForeign = [];

          for (const [itemId, ref] of [...referenced.entries()].sort((a, b) => a[0] - b[0])) {
            const snap = await getDoc(doc(db, "items", String(itemId)));
            if (!snap.exists()) {
              missingDocuments.push(ref);
              continue;
            }

            const data = snap.data() || {};
            const tenantId = String(data.tenantId || data.companyId || "").trim();

            const summary = {
              ...ref,
              docId: snap.id,
              code: data.code || "",
              name: data.name || "",
              type: data.type || "",
              unit: data.unit || "",
              basePrice: data.basePrice ?? null,
              unitPrice: data.unitPrice ?? null,
              imageUrl: data.imageUrl || "",
              tenantId: tenantId || null,
            };

            if (!tenantId) {
              legacyUnscoped.push(summary);
            } else if (tenantId === TENANT) {
              imperioDocuments.push(summary);
            } else {
              // Do not expose or modify data from another tenant; record only the conflicting item id.
              protectedForeign.push({ itemId, tenantConflict: true, sources: ref.sources });
            }
          }

          const result = {
            executedAt: new Date().toISOString(),
            tenant: TENANT,
            counts: {
              visibleItems: visibleItemsSnap.size,
              imperioOrders: ordersSnap.size,
              distinctReferencedItemIds: referenced.size,
              referencedAndVisible: [...referenced.keys()].filter((id) => visibleItemIds.has(id)).length,
              legacyReferencedItemsWithoutTenant: legacyUnscoped.length,
              referencedItemDocsMissingEntirely: missingDocuments.length,
              tenantConflictsNotInspected: protectedForeign.length,
            },
            legacyUnscoped,
            missingDocuments,
            tenantConflictsNotInspected: protectedForeign,
          };

          fs.mkdirSync("diagnostics", { recursive: true });
          fs.writeFileSync(
            "diagnostics/imperio-item-integrity.json",
            JSON.stringify(result, null, 2) + "\n",
          );

          console.log(JSON.stringify(result.counts, null, 2));
          NODE

      - name: Commit audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/imperio-item-integrity.json
          git commit -m "diagnostics: record Imperio item integrity audit" || exit 0
          git push origin HEAD:main
