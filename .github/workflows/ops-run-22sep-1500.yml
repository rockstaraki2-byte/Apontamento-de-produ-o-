name: Run Sep 22 15h order completion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ops-run-22sep-1500.yml

permissions:
  contents: write

jobs:
  finish-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated operational branch
        uses: actions/checkout@v4
        with:
          ref: ops/import-orders-22sep-1500

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Finish orders and write result
        run: npx tsx scripts/ops-finish-orders-22sep-1500.ts

      - name: Commit result to operational branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-results/22sep-1500.json
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "ops: record Sep 22 15h order completion result"
            git push origin HEAD:ops/import-orders-22sep-1500
          fi
