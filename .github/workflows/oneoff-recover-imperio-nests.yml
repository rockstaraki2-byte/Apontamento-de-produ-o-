name: One-off recover recent Imperio nests

on:
  push:
    paths:
      - ".github/workflows/oneoff-recover-imperio-nests.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Recover recent tenantless nests for Imperio
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { initializeApp } from "firebase/app";
          import {
            initializeFirestore,
            collection,
            getDocs,
            setDoc,
          } from "firebase/firestore";

          const config = JSON.parse(fs.readFileSync("firebase-applet-config.json", "utf8"));
          const app = initializeApp({
            apiKey: config.apiKey,
            authDomain: config.authDomain,
            projectId: config.projectId,
            storageBucket: config.storageBucket,
            messagingSenderId: config.messagingSenderId,
            appId: config.appId,
          });
          const db = initializeFirestore(
            app,
            { experimentalForceLongPolling: true },
            config.firestoreDatabaseId,
          );

          // Cyrne was already removed before this point. Restrict recovery to
          // recent records created after the Império-only cleanup.
          const RECOVERY_START = new Date("2026-09-18T00:00:00-03:00").getTime();
          const snap = await getDocs(collection(db, "nestTasks"));

          let restored = 0;
          let alreadyImperio = 0;
          let protectedOtherTenant = 0;
          let oldTenantlessSkipped = 0;
          const restoredDocs = [];

          for (const d of snap.docs) {
            const data = d.data() || {};
            const tenantId = String(data.tenantId || data.companyId || "").trim();
            const createdAt = Number(data.createdAt || 0);

            if (tenantId === "imperio") {
              alreadyImperio++;
              continue;
            }

            if (tenantId) {
              // Never inspect or modify another tenant's record.
              protectedOtherTenant++;
              continue;
            }

            if (!createdAt || createdAt < RECOVERY_START) {
              oldTenantlessSkipped++;
              continue;
            }

            await setDoc(
              d.ref,
              {
                tenantId: "imperio",
                recoveredAt: Date.now(),
                recoveredReason: "nest_created_without_tenant_after_multitenant_scope",
              },
              { merge: true },
            );

            restored++;
            restoredDocs.push({
              id: d.id,
              nestName: String(data.nestName || ""),
              partName: String(data.partName || ""),
              createdAt,
            });
          }

          const result = {
            executedAt: new Date().toISOString(),
            tenant: "imperio",
            recoveryStart: RECOVERY_START,
            restored,
            alreadyImperio,
            protectedOtherTenant,
            oldTenantlessSkipped,
            restoredDocs,
          };

          fs.mkdirSync("diagnostics", { recursive: true });
          fs.writeFileSync(
            "diagnostics/imperio-nest-recovery-result.json",
            JSON.stringify(result, null, 2) + "\n",
          );
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Commit recovery result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add diagnostics/imperio-nest-recovery-result.json
          git commit -m "diagnostics: record Imperio nest recovery result" || exit 0
          git push origin HEAD:main
