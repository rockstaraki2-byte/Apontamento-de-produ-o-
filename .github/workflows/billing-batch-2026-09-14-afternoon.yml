name: Billing batch Sep 14 afternoon

on:
  push:
    branches:
      - feature/chat-billing-api
    paths:
      - '.github/workflows/billing-batch-2026-09-14-afternoon.yml'
      - 'scripts/billing-batch-2026-09-14-afternoon-diagnose.ts'
      - 'scripts/billing-batch-2026-09-14-afternoon-preview.ts'
      - 'scripts/billing-batch-2026-09-14-afternoon-execute.ts'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Execute Sep 14 afternoon billings
        run: npx tsx scripts/billing-batch-2026-09-14-afternoon-execute.ts
