name: Apply expedition module source changes

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-expedition-module.cjs
      - scripts/fix-expedition-linking.cjs
      - .github/workflows/apply-expedition-module.yml

permissions:
  contents: write

jobs:
  apply-source-changes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply expedition module patches
        run: |
          node scripts/apply-expedition-module.cjs
          node scripts/fix-expedition-linking.cjs

      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/useDatabase.ts src/App.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: integrate load planning and expedition module"
          git push origin HEAD:main
