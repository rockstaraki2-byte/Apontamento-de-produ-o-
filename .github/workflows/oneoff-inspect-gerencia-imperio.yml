name: One-off inspect gerencia imperio

on:
  push:
    paths:
      - ".github/workflows/oneoff-inspect-gerencia-imperio.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Inspect user and scoped data
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { initializeApp } from "firebase/app";
          import {
            initializeFirestore,
            collection,
            doc,
            getDoc,
            getDocs,
            query,
            where,
          } from "firebase/firestore";

          const config = JSON.parse(fs.readFileSync("firebase-applet-config.json", "utf8"));
          const app = initializeApp({
            apiKey: config.apiKey,
            authDomain: config.authDomain,
            projectId: config.projectId,
            storageBucket: config.storageBucket,
            messagingSenderId: config.messagingSenderId,
            appId: config.appId,
          });
          const db = initializeFirestore(
            app,
            { experimentalForceLongPolling: true },
            config.firestoreDatabaseId,
          );

          const userIds = ["gerencia", "gerencia.imperio"];
          const users = {};
          for (const id of userIds) {
            const snap = await getDoc(doc(db, "users", id));
            users[id] = snap.exists() ? { exists: true, data: snap.data() } : { exists: false };
          }

          const tenantSnap = await getDoc(doc(db, "tenants", "imperio"));
          const tenant = tenantSnap.exists() ? tenantSnap.data() : null;

          const collections = [
            "items","orders","logs","attributes","activePacks","nestTasks",
            "notifications","stocks","stock_movements","employees","customers",
            "sectors","productFlows","productionBatches","productionAgendas",
            "coilCuttingPlans","cargas","expeditionRoutes","productionSchedules",
            "systemSettings","laserQuotes","sheetStocks","prensaPendingProductions"
          ];

          const counts = {};
          for (const name of collections) {
            try {
              const snap = await getDocs(query(collection(db, name), where("tenantId", "==", "imperio")));
              counts[name] = snap.size;
            } catch (error) {
              counts[name] = { error: error?.message || String(error), code: error?.code || null };
            }
          }

          const result = {
            executedAt: new Date().toISOString(),
            users,
            tenant: tenant ? {
              id: tenant.id || "imperio",
              name: tenant.name || "",
              allowedScreens: tenant.allowedScreens || null,
              machines: tenant.machines || null,
              systemName: tenant.systemName || null
            } : null,
            counts
          };

          fs.mkdirSync("diagnostics",{recursive:true});
          fs.writeFileSync("diagnostics/gerencia-imperio-audit.json",JSON.stringify(result,null,2)+"\n");
          console.log(JSON.stringify(result,null,2));
          NODE
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add diagnostics/gerencia-imperio-audit.json
          git commit -m "diagnostics: inspect gerencia imperio session" || exit 0
          git push origin HEAD:main
