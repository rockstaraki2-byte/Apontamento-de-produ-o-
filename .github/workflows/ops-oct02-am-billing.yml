name: Ops Oct02 AM Billing
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ops-oct02-am-billing.ts'
      - '.github/workflows/ops-oct02-am-billing.yml'
jobs:
  bill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/ops-oct02-am-billing.ts
