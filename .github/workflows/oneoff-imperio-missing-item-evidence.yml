name: One-off inspect 7 missing Imperio items

on:
  push:
    paths:
      - ".github/workflows/oneoff-imperio-missing-item-evidence.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Collect evidence for missing item documents
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { initializeApp } from "firebase/app";
          import {
            initializeFirestore,
            collection,
            getDocs,
            query,
            where,
          } from "firebase/firestore";

          const config = JSON.parse(fs.readFileSync("firebase-applet-config.json", "utf8"));
          const app = initializeApp({
            apiKey: config.apiKey,
            authDomain: config.authDomain,
            projectId: config.projectId,
            storageBucket: config.storageBucket,
            messagingSenderId: config.messagingSenderId,
            appId: config.appId,
          });
          const db = initializeFirestore(
            app,
            { experimentalForceLongPolling: true },
            config.firestoreDatabaseId,
          );

          const TENANT = "imperio";
          const ids = new Set([797, 2517, 3193, 3194, 4599, 1779765282317, 1779992443153]);
          const out = {};
          for (const id of ids) out[id] = { itemId: id, orders: [], prices: [], logs: [], stocks: [], movements: [] };

          const [orders, prices, logs, stocks, movements] = await Promise.all([
            getDocs(query(collection(db, "orders"), where("tenantId", "==", TENANT))),
            getDocs(query(collection(db, "priceHistories"), where("tenantId", "==", TENANT))),
            getDocs(query(collection(db, "logs"), where("tenantId", "==", TENANT))),
            getDocs(query(collection(db, "stocks"), where("tenantId", "==", TENANT))),
            getDocs(query(collection(db, "stock_movements"), where("tenantId", "==", TENANT))),
          ]);

          orders.forEach((d) => {
            const x = d.data();
            const id = Number(x.itemId);
            if (!ids.has(id)) return;
            out[id].orders.push({
              orderId: d.id,
              orderCode: x.orderCode || "",
              customProductName: x.customProductName || "",
              originalProductCode: x.originalProductCode || "",
              unit: x.unit || "",
              unitPrice: Number.isFinite(Number(x.unitPrice)) ? Number(x.unitPrice) : null,
              color: x.color || "",
              size: x.size || "",
              variation: x.variation || "",
              customerName: x.customerName || "",
              createdAt: Number(x.createdAt) || 0,
            });
          });

          prices.forEach((d) => {
            const x = d.data();
            const id = Number(x.itemId);
            if (!ids.has(id)) return;
            out[id].prices.push({
              priceId: d.id,
              unitPrice: Number.isFinite(Number(x.unitPrice)) ? Number(x.unitPrice) : null,
              customerName: x.customerName || "",
              orderCode: x.orderCode || "",
              createdAt: Number(x.createdAt) || 0,
              source: x.source || "",
            });
          });

          logs.forEach((d) => {
            const x = d.data();
            for (const candidate of [x.itemId, x.parentItemId]) {
              const id = Number(candidate);
              if (!ids.has(id)) continue;
              out[id].logs.push({
                logId: d.id,
                customProductName: x.customProductName || "",
                nestedPartName: x.nestedPartName || "",
                processName: x.processName || "",
                type: x.type || "",
                timestamp: Number(x.timestamp) || 0,
              });
            }
          });

          stocks.forEach((d) => {
            const x = d.data();
            const id = Number(x.itemId);
            if (!ids.has(id)) return;
            out[id].stocks.push({
              stockId: d.id,
              color: x.color || "",
              size: x.size || "",
              variation: x.variation || "",
              stage: x.stage || "",
              quantity: Number(x.quantity) || 0,
              measurementUnit: x.measurementUnit || "",
            });
          });

          movements.forEach((d) => {
            const x = d.data();
            const id = Number(x.itemId);
            if (!ids.has(id)) return;
            out[id].movements.push({
              movementId: d.id,
              type: x.type || "",
              quantity: Number(x.quantity) || 0,
              description: x.description || "",
              timestamp: Number(x.timestamp) || 0,
            });
          });

          for (const id of ids) {
            out[id].orders.sort((a, b) => b.createdAt - a.createdAt);
            out[id].prices.sort((a, b) => b.createdAt - a.createdAt);
            out[id].logs.sort((a, b) => b.timestamp - a.timestamp);
            out[id].movements.sort((a, b) => b.timestamp - a.timestamp);
            out[id].orders = out[id].orders.slice(0, 30);
            out[id].prices = out[id].prices.slice(0, 30);
            out[id].logs = out[id].logs.slice(0, 30);
            out[id].movements = out[id].movements.slice(0, 30);
          }

          const result = {
            executedAt: new Date().toISOString(),
            tenant: TENANT,
            items: out,
          };

          fs.writeFileSync(
            "diagnostics/imperio-missing-item-evidence.json",
            JSON.stringify(result, null, 2) + "\n",
          );
          console.log(JSON.stringify(
            Object.fromEntries([...ids].map((id) => [id, {
              orders: out[id].orders.length,
              prices: out[id].prices.length,
              logs: out[id].logs.length,
              stocks: out[id].stocks.length,
              movements: out[id].movements.length,
            }])),
            null,
            2,
          ));
          NODE

      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add diagnostics/imperio-missing-item-evidence.json
          git commit -m "diagnostics: record evidence for 7 missing Imperio items" || exit 0
          git push origin HEAD:main
