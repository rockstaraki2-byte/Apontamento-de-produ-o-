name: Ops Sep30 AM Billing Check
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ops-sep30-am-check.mjs'
      - '.github/workflows/ops-sep30-am-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/ops-sep30-am-check.mjs
