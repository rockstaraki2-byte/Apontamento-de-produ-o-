name: Harden expedition module

on:
  push:
    branches:
      - main
    paths:
      - scripts/harden-expedition-module.cjs
      - .github/workflows/harden-expedition-module.yml

permissions:
  contents: write

jobs:
  harden-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply hardening patches
        run: node scripts/harden-expedition-module.cjs

      - name: Commit hardening changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/ProgramacaoCargasScreen.tsx src/ExpedicaoTVScreen.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix: harden load allocation and packaging progress"
          git push origin HEAD:main
