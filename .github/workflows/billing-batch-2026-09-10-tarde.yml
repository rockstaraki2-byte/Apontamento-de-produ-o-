name: Billing batch Sep 10 afternoon

on:
  push:
    branches:
      - feature/chat-billing-api
    paths:
      - '.github/workflows/billing-batch-2026-09-10-tarde.yml'
      - 'scripts/billing-batch-2026-09-10-tarde-diagnose.ts'
      - 'scripts/billing-batch-2026-09-10-tarde-preview.ts'
      - 'scripts/billing-batch-2026-09-10-tarde-execute.ts'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Preview afternoon orders
        run: npx tsx scripts/billing-batch-2026-09-10-tarde-preview.ts
