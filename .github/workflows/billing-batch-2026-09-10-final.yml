name: Billing batch Sep 10 final check

on:
  push:
    branches:
      - feature/chat-billing-api
    paths:
      - '.github/workflows/billing-batch-2026-09-10-final.yml'
      - 'scripts/billing-batch-2026-09-10-final-diagnose.ts'
      - 'scripts/billing-batch-2026-09-10-final-preview.ts'
      - 'scripts/billing-batch-2026-09-10-final-execute.ts'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Execute five validated billings
        run: npx tsx scripts/billing-batch-2026-09-10-final-execute.ts
