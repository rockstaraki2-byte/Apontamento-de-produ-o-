name: Billing smoke test 2

on:
  push:
    branches:
      - feature/chat-billing-api
    paths:
      - '.github/workflows/billing-smoke-test-2.yml'
      - 'scripts/billing-smoke-test-2.ts'

permissions:
  contents: read

jobs:
  run-billing-smoke-test-2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run guarded billing smoke test 2
        run: npx tsx scripts/billing-smoke-test-2.ts
