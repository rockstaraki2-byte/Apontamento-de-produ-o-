name: One-off capture build error

on:
  push:
    paths:
      - ".github/workflows/oneoff-capture-build-error.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Capture build output
        shell: bash
        run: |
          set +e
          npm run build > build-output.txt 2>&1
          CODE=$?
          set -e
          mkdir -p diagnostics
          {
            echo "exit_code=$CODE"
            echo "----- build output -----"
            cat build-output.txt
          } > diagnostics/build-error-current.txt
      - name: Commit build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add diagnostics/build-error-current.txt
          git commit -m "diagnostics: capture current build error" || exit 0
          git push origin HEAD:main
