name: One-off scan missing Imperio item references

on:
  push:
    paths:
      - ".github/workflows/oneoff-imperio-missing-item-scan.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Scan Imperio operational collections for the 7 item ids
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { initializeApp } from "firebase/app";
          import {
            initializeFirestore,
            collection,
            getDocs,
            query,
            where,
          } from "firebase/firestore";

          const config = JSON.parse(fs.readFileSync("firebase-applet-config.json", "utf8"));
          const app = initializeApp({
            apiKey: config.apiKey,
            authDomain: config.authDomain,
            projectId: config.projectId,
            storageBucket: config.storageBucket,
            messagingSenderId: config.messagingSenderId,
            appId: config.appId,
          });
          const db = initializeFirestore(
            app,
            { experimentalForceLongPolling: true },
            config.firestoreDatabaseId,
          );

          const TENANT = "imperio";
          const ids = new Set([797, 2517, 3193, 3194, 4599, 1779765282317, 1779992443153]);
          const collections = [
            "prensaPendingProductions",
            "activeTasks",
            "productionSteps",
            "qualityInspections",
            "coilCuttingPlans",
            "nestTasks",
            "productionBatches",
            "cargas",
          ];

          function containsTarget(value, depth = 0) {
            if (depth > 5 || value == null) return [];
            const found = [];
            if (typeof value === "number" && ids.has(value)) return [value];
            if (typeof value === "string") {
              const n = Number(value);
              if (Number.isFinite(n) && ids.has(n)) return [n];
              return [];
            }
            if (Array.isArray(value)) {
              for (const x of value) found.push(...containsTarget(x, depth + 1));
              return [...new Set(found)];
            }
            if (typeof value === "object") {
              for (const x of Object.values(value)) found.push(...containsTarget(x, depth + 1));
            }
            return [...new Set(found)];
          }

          function selectedFields(data) {
            const keys = [
              "itemId",
              "parentItemId",
              "partName",
              "customProductName",
              "nestedPartName",
              "name",
              "description",
              "notes",
              "orderCode",
              "orderId",
              "customerName",
              "processName",
              "taskName",
              "nestName",
              "targetItemIds",
              "coilItemId",
              "createdAt",
              "timestamp",
            ];
            const out = {};
            for (const key of keys) {
              if (data[key] !== undefined) out[key] = data[key];
            }
            return out;
          }

          const matches = Object.fromEntries([...ids].map((id) => [id, []]));
          const collectionStats = {};

          for (const name of collections) {
            try {
              const snap = await getDocs(
                query(collection(db, name), where("tenantId", "==", TENANT)),
              );
              collectionStats[name] = snap.size;

              snap.forEach((d) => {
                const data = d.data() || {};
                const hitIds = containsTarget(data);
                for (const id of hitIds) {
                  if (matches[id].length >= 30) continue;
                  matches[id].push({
                    collection: name,
                    docId: d.id,
                    ...selectedFields(data),
                  });
                }
              });
            } catch (error) {
              collectionStats[name] = {
                error: error?.message || String(error),
                code: error?.code || null,
              };
            }
          }

          const result = {
            executedAt: new Date().toISOString(),
            tenant: TENANT,
            collectionStats,
            matches,
          };

          fs.writeFileSync(
            "diagnostics/imperio-missing-item-operational-scan.json",
            JSON.stringify(result, null, 2) + "\n",
          );
          console.log(JSON.stringify(
            Object.fromEntries([...ids].map((id) => [id, matches[id].length])),
            null,
            2,
          ));
          NODE

      - name: Commit scan result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add diagnostics/imperio-missing-item-operational-scan.json
          git commit -m "diagnostics: scan operational references for missing Imperio items" || exit 0
          git push origin HEAD:main
