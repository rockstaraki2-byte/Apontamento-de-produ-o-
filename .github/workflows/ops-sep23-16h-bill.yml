name: Ops Sep23 16h Billing
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ops-sep23-16h-bill.ts'
      - '.github/workflows/ops-sep23-16h-bill.yml'
jobs:
  bill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/ops-sep23-16h-bill.ts
