name: Apply load order filters

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-carga-order-filters.yml

permissions:
  contents: write

jobs:
  patch-load-filters:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/oneoff-carga-order-filters.cjs

      - name: Commit source and cleanup
        run: |
          rm -f .github/workflows/oneoff-carga-order-filters.yml scripts/oneoff-carga-order-filters.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ProgramacaoCargasScreen.tsx .github/workflows/oneoff-carga-order-filters.yml scripts/oneoff-carga-order-filters.cjs
          git commit -m "feat: add filters to load order planning"
          git push origin HEAD:main
