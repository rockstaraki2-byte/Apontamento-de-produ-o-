name: Billing batch Sep 15 pending lines

on:
  push:
    branches:
      - feature/chat-billing-api
    paths:
      - '.github/workflows/billing-batch-2026-09-15-pendentes.yml'
      - 'scripts/billing-batch-2026-09-15-pendentes-execute.ts'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Execute Sep 15 pending billings
        run: npx tsx scripts/billing-batch-2026-09-15-pendentes-execute.ts
