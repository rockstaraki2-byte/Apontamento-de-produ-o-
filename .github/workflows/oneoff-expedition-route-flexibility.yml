name: Apply route-first expedition workflow

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-expedition-route-flexibility.yml

permissions:
  contents: write

jobs:
  patch-expedition:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply route-first expedition changes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function patch(path, find, replace, label) {
            let source = fs.readFileSync(path, 'utf8');
            if (!source.includes(find)) {
              throw new Error(`Alvo não encontrado (${label}) em ${path}`);
            }
            source = source.replace(find, replace);
            fs.writeFileSync(path, source, 'utf8');
            console.log(`OK: ${label}`);
          }

          const screen = 'src/ProgramacaoCargasScreen.tsx';
          const db = 'src/useDatabase.ts';

          patch(
            screen,
            'const SHIFT_LABEL: Record<string, string> = { MANHA: "Manhã", TARDE: "Tarde" };\n',
            'const SHIFT_LABEL: Record<string, string> = { MANHA: "Manhã", TARDE: "Tarde" };\nconst MONTH_ABBR = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];\n',
            'abreviações de mês para nome da carga',
          );

          patch(
            screen,
            '    if (routeCustomerIds.length === 0) {\n      alert("Selecione ao menos um cliente para esta rota.");\n      return;\n    }\n\n',
            '',
            'permitir rota sem cliente',
          );

          patch(
            screen,
            '    const pretty = selectedDate?.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) || loadDate;\n    const name = `${route.name} • ${pretty} • ${SHIFT_LABEL[route.shift]}`;\n\n    await db.addCarga({',
            '    const pretty = selectedDate\n      ? `${String(selectedDate.getDate()).padStart(2, "0")}/${MONTH_ABBR[selectedDate.getMonth()]}`\n      : loadDate;\n    const name = `Carga do dia ${pretty}`;\n\n    const cargaId = await db.addCarga({',
            'nome padrão Carga do dia dd/mmm',
          );

          patch(
            screen,
            '    setShowLoadForm(false);\n    setTab("SEMANA");',
            '    setTargetCargaId(cargaId);\n    setSelectedQuantities({});\n    setOrderSearch("");\n    setShowLoadForm(false);\n    setTab("PEDIDOS");',
            'abrir inclusão de pedidos após criar carga',
          );

          patch(
            screen,
            '["PEDIDOS", "Pedidos sem Carga", ClipboardList],',
            '["PEDIDOS", "Adicionar Pedidos", ClipboardList],',
            'renomear aba de pedidos',
          );

          patch(
            screen,
            '<h3 className="font-extrabold text-slate-900">Vinculação rápida de pedidos</h3>\n                <p className="text-xs text-slate-500">Mostra somente o saldo ainda não distribuído em uma carga ativa.</p>',
            '<h3 className="font-extrabold text-slate-900">Adicionar pedidos à carga</h3>\n                <p className="text-xs text-slate-500">Busque qualquer pedido com saldo disponível, inclusive pedidos que já estejam loteados. O lote de produção não interfere na programação da carga.</p>',
            'explicar inclusão de pedidos loteados',
          );

          patch(
            screen,
            '{editableLoads.map((c) => <option key={c.id} value={c.id}>{formatDate(getLoadDate(c))} • {c.routeName || c.name}</option>)}',
            '{editableLoads.map((c) => <option key={c.id} value={c.id}>{c.name} • {c.routeName || "Sem rota"}</option>)}',
            'identificar carga pelo novo nome no seletor',
          );

          patch(
            screen,
            '<div><h3 className="font-extrabold text-slate-900">{editingRouteId ? "Editar rota" : "Nova rota recorrente"}</h3><p className="text-xs text-slate-500">Defina região, dia, turno e clientes atendidos.</p></div>',
            '<div><h3 className="font-extrabold text-slate-900">{editingRouteId ? "Editar rota" : "Nova rota recorrente"}</h3><p className="text-xs text-slate-500">Defina a rota fixa, o dia e o turno. Vincular clientes é opcional.</p></div>',
            'texto de rota fixa',
          );

          patch(
            screen,
            '<div className="border border-slate-200 rounded-xl overflow-hidden"><div className="p-2 border-b border-slate-100"><input value={routeCustomerSearch}',
            '<div className="border border-slate-200 rounded-xl overflow-hidden"><div className="px-2 pt-2 text-[10px] uppercase font-extrabold text-slate-500">Clientes vinculados (opcional)</div><div className="p-2 border-b border-slate-100"><input value={routeCustomerSearch}',
            'marcar clientes como opcionais',
          );

          patch(
            screen,
            '<p className="text-xs text-slate-500"><strong>{customerNames.length}</strong> cliente(s) vinculados</p>',
            '<p className="text-xs text-slate-500">{customerNames.length > 0 ? <><strong>{customerNames.length}</strong> cliente(s) vinculados</> : "Sem clientes fixos — os pedidos serão incluídos manualmente nas cargas."}</p>',
            'estado de rota sem cliente',
          );

          patch(
            screen,
            '<div className="flex justify-between items-start"><div><h3 className="font-extrabold text-slate-900 text-lg">Programar nova carga</h3><p className="text-xs text-slate-500">A carga nasce aberta e pode receber pedidos até o fechamento.</p></div>',
            '<div className="flex justify-between items-start"><div><h3 className="font-extrabold text-slate-900 text-lg">Programar nova carga</h3><p className="text-xs text-slate-500">Escolha a rota fixa e a data. Depois você será levado para buscar e incluir os pedidos, inclusive os já loteados.</p></div>',
            'orientação do cadastro de carga',
          );

          patch(
            db,
            '      await setDoc(doc(db, "cargas", id), cleanUndefined({ ...carga, id }));\n    },',
            '      await setDoc(doc(db, "cargas", id), cleanUndefined({ ...carga, id }));\n      return id;\n    },',
            'retornar id ao criar carga',
          );
          NODE

      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/oneoff-expedition-route-flexibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ProgramacaoCargasScreen.tsx src/useDatabase.ts .github/workflows/oneoff-expedition-route-flexibility.yml
          git commit -m "feat: make expedition route-first and allow unassigned customers"
          git push origin HEAD:main
